  <style>
    .tool-card {
      display: flex;
      flex-direction: column;
    }
    .tool-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 2px;
      margin-bottom: 1rem;
      border: 1px solid var(--card-border);
    }
    .tool-img-placeholder {
      width: 100%;
      height: 160px;
      background: var(--bg3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      border: 1px solid var(--card-border);
    }
    .tool-links {
      display: flex;
      gap: 0.6rem;
      margin-top: auto;
      padding-top: 1rem;
      flex-wrap: wrap;
    }
    .tool-tags {
      display: flex;
      flex-wrap: wrap;
      margin: 0.5rem 0;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal {
      background: #030d03;
      border: 1px solid var(--green);
      border-radius: 4px;
      max-width: 600px;
      width: 100%;
      padding: 2rem;
      position: relative;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }
    .modal-close:hover {
      color: var(--red);
    }
    .modal h2 {
      font-family: var(--font-head);
      color: var(--cyan);
      margin-bottom: 1rem;
    }
    .modal p {
      color: var(--text-muted);
      line-height: 1.8;
      font-size: 0.9rem;
    }
  </style>

  <script type="module">
    import { startMatrixRain } from '../assets/js/matrix.js';
    import { db } from '../assets/js/firebase-config.js';
    import { ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    startMatrixRain();

    // Firebase node name for tools (existing data stays under 'projects')
    const TOOLS_PATH = 'projects';

    // ──────────────────────────────────────────────
    // Modal helpers
    // ──────────────────────────────────────────────
    function showModal(name, about) {
      document.getElementById('modal-title').textContent = name || '';
      document.getElementById('modal-body').innerHTML =
        `<p>${about || 'No additional details.'}</p>`;
      document.getElementById('tool-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('tool-modal').classList.remove('open');
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('tool-modal').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });

    // ──────────────────────────────────────────────
    // Load tools from Firebase
    // ──────────────────────────────────────────────
    async function loadTools() {
      const container = document.getElementById('tools-container');

      try {
        const snap = await get(ref(db, TOOLS_PATH));

        // Debug: browser console-এ দেখুন
        console.log('Firebase snapshot exists:', snap.exists());
        console.log('Firebase snapshot size:', snap.size);
        console.log('Firebase raw data:', snap.val());

        if (!snap.exists()) {
          container.innerHTML =
            '<div class="empty-state" style="grid-column:1/-1">&gt; No tools yet. Add via admin dashboard.</div>';
          return;
        }

        // Collect all children into an array
        const items = [];
        snap.forEach(child => {
          const val = child.val();
          if (val && typeof val === 'object') {
            items.push({ key: child.key, ...val });
          }
        });

        console.log('Total items loaded:', items.length);

        if (items.length === 0) {
          container.innerHTML =
            '<div class="empty-state" style="grid-column:1/-1">&gt; No tools found in database.</div>';
          return;
        }

        // Newest first
        items.reverse();

        container.innerHTML = '';

        items.forEach(d => {
          const name  = d.name  || 'Untitled';
          const about = d.about || '';
          const tags  = Array.isArray(d.tags)
            ? d.tags.map(t => `<span class="tag">${t}</span>`).join('')
            : '';

          const card = document.createElement('div');
          card.className = 'card tool-card';

          // Build image HTML
          const imgHtml = d.imageUrl
            ? `<img src="${d.imageUrl}" class="tool-img" alt="${name}" onerror="this.style.display='none'">`
            : `<div class="tool-img-placeholder">// TOOL IMAGE</div>`;

          // Build link buttons HTML
          const liveBtn = d.liveUrl
            ? `<a href="${d.liveUrl}" target="_blank" class="btn btn-sm" style="border-color:var(--cyan);color:var(--cyan)">Live</a>`
            : '';
          const githubBtn = d.githubUrl
            ? `<a href="${d.githubUrl}" target="_blank" class="btn btn-sm" style="border-color:var(--amber);color:var(--amber)">GitHub</a>`
            : '';

          // Preview text (first 120 chars)
          const preview = about.length > 120
            ? about.substring(0, 120) + '...'
            : about;

          card.innerHTML = `
            ${imgHtml}
            <h3>${name}</h3>
            <p>${preview}</p>
            <div class="tool-tags">${tags}</div>
            <div class="tool-links">
              <button class="btn btn-sm details-btn">Details</button>
              ${liveBtn}
              ${githubBtn}
            </div>
          `;

          // ✅ Event listener ব্যবহার করুন — inline onclick নয়
          // এটাই মূল fix: backtick/quote থাকলেও safe
          card.querySelector('.details-btn').addEventListener('click', () => {
            showModal(name, about);
          });

          container.appendChild(card);
        });

      } catch (e) {
        console.error('Firebase load error:', e);
        container.innerHTML =
          `<div class="empty-state" style="grid-column:1/-1">&gt; Error: ${e.message}</div>`;
      }
    }

    loadTools();

    // ──────────────────────────────────────────────
    // Mobile menu
    // ──────────────────────────────────────────────
    const hamburger  = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobile-menu');

    hamburger.addEventListener('click', () => {
      mobileMenu.classList.toggle('open');
    });

    mobileMenu.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => mobileMenu.classList.remove('open'));
    });
  </script>
